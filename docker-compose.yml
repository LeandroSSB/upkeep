# Dev: postgres 18 + api com migrations automáticas no boot (ApplyMigrations=true).
# Uso: cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-upkeep}
    volumes:
      - upkeep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upkeep} -d ${POSTGRES_DB:-upkeep}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Upkeep: Host=db;Database=${POSTGRES_DB:-upkeep};Username=${POSTGRES_USER:-upkeep};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      ApplyMigrations: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  upkeep-pgdata:
