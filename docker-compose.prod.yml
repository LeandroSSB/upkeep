# Override de produção:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Nota ports: o merge do compose ANEXA listas entre arquivos (sairiam 8080 E 14010
# mapeadas). A tag `!override` (compose >= 2.24) substitui a lista do dev em vez de
# somar — só 127.0.0.1:14010 fica publicado, atrás do nginx/reverse-proxy.
services:
  api:
    ports: !override
      - "127.0.0.1:14010:8080"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
