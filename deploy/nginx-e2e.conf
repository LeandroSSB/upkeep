# nginx do stack E2E (docker-compose.e2e.yml) — mesma topologia pública do prod
# (deploy/nginx-site.conf.example), sem TLS/certs/domínio: HTTP puro no container,
# publicado em 127.0.0.1:14090. Upstream é o serviço "api" da rede do compose.
# /api/* com strip do prefixo (proxy_pass com "/" final); o resto é o SPA servido
# pela própria imagem da API (wwwroot + fallback). sw.js e index.html sem cache.
# X-Original-URI alimenta o 404 JSON de /api/* desconhecido no app (ver Program.cs).

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Import de backup via POST pode passar de 1MB (default do nginx = 413)
    client_max_body_size 8m;

    location = /sw.js {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI "";
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI "";
        add_header Cache-Control "no-cache";
    }
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 90;
    }
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI "";
        proxy_read_timeout 90;
    }
}
