name: ci
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore upkeep.sln
      - run: dotnet build upkeep.sln --no-restore --configuration Release
      - run: dotnet test upkeep.sln --no-build --configuration Release
      # Smoke de imagem: Dockerfile + .dockerignore buildam limpos.
      - run: docker build -t upkeep-api-ci .
