name: ci
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore upkeep.sln
      - run: dotnet build upkeep.sln --no-restore --configuration Release
      - run: dotnet test upkeep.sln --no-build --configuration Release
      # Smoke de imagem: Dockerfile + .dockerignore buildam limpos.
      - run: docker build -t upkeep-api-ci .

  # SPA: vitest + type-check (tsc -b) + build Vite — mesmos passos do stage web do Dockerfile.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build

  # E2E: Playwright contra o stack real (pg + api + nginx) via compose — a
  # topologia pública do prod em porta alta local (127.0.0.1:14090). Stack
  # efêmero por run (sem volumes; down -v sempre, mesmo em falha).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Subir stack e2e (postgres + api + nginx)
        working-directory: .
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Esperar stack saudavel (api/health, timeout 120s)
        run: |
          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:14090/api/health >/dev/null; do sleep 2; done'
      - run: npm run test:e2e
      - name: Derrubar stack e2e
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
